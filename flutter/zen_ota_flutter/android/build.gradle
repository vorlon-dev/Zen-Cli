group 'ota.zen'
version '1.0.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Kotlin only. AGP comes from the host app — plugins must not pin it.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'ota.zen.flutter'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Zero dependencies by design: ota.zen.android.ZenUpdater (shipped verbatim in
// src/main/kotlin) uses only the Android framework + org.json. The Flutter
// embedding classes are provided by the host app's build at compile time.
